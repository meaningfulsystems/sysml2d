<svg xmlns="http://www.w3.org/2000/svg" width="2711" height="472" viewBox="0 0 2711 472">
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.label{font-size:13px}.small{font-size:11px}.header{font-size:14px;font-weight:600}</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1D4ED8"/></marker>
<marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#334155"/></marker>
<marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="strokeWidth"><polygon points="0 6,6 0,12 6,6 12" fill="#111827" stroke="#111827"/></marker>
</defs>
<rect x="0" y="0" width="2711" height="472" fill="#FFFFFF"/>
<rect x="2" y="38" width="2707" height="430" fill="none" stroke="#333333" stroke-width="2"/>
<path d="M 2 1 H 424 L 440 38 H 2 Z" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
<text class="header" x="12" y="24">[req.mb] Electric Bike Requirements [ElectricBike]</text>
<rect x="2" y="38" width="2707" height="432" fill="none" stroke="#333333" stroke-width="0"/>
<g transform="translate(2,40)">
<rect id="rideSafetyRequirement" x="72" y="72" width="258" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="201" y="93.5">«requirement»</tspan><tspan x="201" dy="15">REQ-E-001 Ride Safety</tspan><tspan x="201" dy="15">Fail-silent: brakes, controller,</tspan><tspan x="201" dy="15">sensors, and BMS cut torque.</tspan></text>
<rect id="rangeRequirement" x="386" y="72" width="237" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="504.5" y="93.5">«requirement»</tspan><tspan x="504.5" dy="15">REQ-E-002 Range (Tour)</tspan><tspan x="504.5" dy="15">usableWh 500 / energyPerKm</tspan><tspan x="504.5" dy="15">~8.3 =&gt; 60 km. Not Eco/PAS-1.</tspan></text>
<rect id="assistLimitRequirement" x="951" y="72" width="244" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1073" y="93.5">«requirement»</tspan><tspan x="1073" dy="15">REQ-E-003 Assist Limit</tspan><tspan x="1073" dy="15">EPAC cadence PAS, no throttle.</tspan><tspan x="1073" dy="15">25 km/h cut; walk assist &lt;= 6.</tspan></text>
<rect id="chargeSafetyRequirement" x="1523" y="72" width="258" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1652" y="93.5">«requirement»</tspan><tspan x="1652" dy="15">REQ-E-004 Charge Safety</tspan><tspan x="1652" dy="15">Stop on over-temp, over-voltage,</tspan><tspan x="1652" dy="15">or charger disconnect.</tspan></text>
<rect id="structuralRequirement" x="1837" y="72" width="251" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1962.5" y="93.5">«requirement»</tspan><tspan x="1962.5" dy="15">REQ-E-030 Structure</tspan><tspan x="1962.5" dy="15">Frame carries rider, cargo, and</tspan><tspan x="1962.5" dy="15">battery loads without yield.</tspan></text>
<rect id="displayRequirement" x="2144" y="72" width="265" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="2276.5" y="93.5">«requirement»</tspan><tspan x="2276.5" dy="15">REQ-E-020 Display</tspan><tspan x="2276.5" dy="15">Show speed, assist, and remaining</tspan><tspan x="2276.5" dy="15">range on the bar display.</tspan></text>
<rect id="lightingRequirement" x="2465" y="72" width="170" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="2550" y="93.5">«requirement»</tspan><tspan x="2550" dy="15">REQ-E-040 Lighting</tspan><tspan x="2550" dy="15">StVZO / ISO 6742.</tspan><tspan x="2550" dy="15">Not UN ECE R113.</tspan></text>
<rect id="brakeOverrideRequirement" x="82.5" y="270" width="237" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="201" y="291.5">«requirement»</tspan><tspan x="201" dy="15">REQ-E-010 Brake Override</tspan><tspan x="201" dy="15">Electronic inhibit &lt;= 50 ms.</tspan><tspan x="201" dy="15">~10x tighter than EN 15194 m.</tspan></text>
<rect id="en15194DistanceRequirement" x="679" y="270" width="258" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="808" y="291.5">«requirement»</tspan><tspan x="808" dy="15">REQ-E-012 EN 15194 Distance</tspan><tspan x="808" dy="15">Cut assist within 5 m after</tspan><tspan x="808" dy="15">pedaling stops (2 m if tighter).</tspan></text>
<rect id="batteryCutoffRequirement" x="1533.5" y="270" width="237" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1652" y="291.5">«requirement»</tspan><tspan x="1652" dy="15">REQ-E-011 Battery Cutoff</tspan><tspan x="1652" dy="15">BMS inside the pack opens the</tspan><tspan x="1652" dy="15">contactor (UL 2849).</tspan></text>
<rect id="walkAssistRequirement" x="993" y="270" width="195" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1090.5" y="291.5">«requirement»</tspan><tspan x="1090.5" dy="15">REQ-E-013 Walk Assist</tspan><tspan x="1090.5" dy="15">&lt;= 6 km/h EPAC feature.</tspan><tspan x="1090.5" dy="15">Not a throttle.</tspan></text>
<rect id="continuousPowerRequirement" x="1244" y="264" width="223" height="82" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1355.5" y="290">«requirement»</tspan><tspan x="1355.5" dy="15">REQ-E-014 Continuous Power</tspan><tspan x="1355.5" dy="15">Assist &lt;= 250 W continuous.</tspan></text>
<path d="M 201,160 L 201,270" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1012,160 L 808,270" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1073,160 L 1090.5,270" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1134,160 L 1355.5,264" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1652,160 L 1652,270" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text class="small" x="213" y="215">refine</text>
<text class="small" text-anchor="middle" x="910" y="203">refine</text>
<text class="small" x="1093.75" y="215">refine</text>
<text class="small" text-anchor="middle" x="1244.75" y="200">refine</text>
<text class="small" x="1664" y="215">refine</text>
</g>
</svg>
