<text class="small" text-anchor="middle" x="809.961" y="203">derive</text>
<text class="small" text-anchor="middle" x="982.5" y="203">derive</text>
<text class="small" text-anchor="middle" x="1144.54" y="203">refine</text>
<text class="small" x="237.218" y="413">refine</text>
<text class="small" x="405.033" y="413">refine</text>
<text class="small" x="757.5" y="413">refine</text>
