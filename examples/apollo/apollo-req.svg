<marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#334155"/></marker>
<marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="strokeWidth"><polygon points="0 6,6 0,12 6,6 12" fill="#111827" stroke="#111827"/></marker>
</defs>
<rect x="0" y="0" width="4276" height="472" fill="#FFFFFF"/>
<rect x="2" y="38" width="4272" height="430" fill="none" stroke="#333333" stroke-width="2"/>
<path d="M 2 1 H 424 L 440 38 H 2 Z" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
<text class="header" x="12" y="24">[req.mb] Apollo 11 Sourced Requirements [Apollo11]</text>
<rect x="2" y="38" width="4272" height="432" fill="none" stroke="#333333" stroke-width="0"/>
<g transform="translate(2,40)">
<rect id="agcRequirement" x="72" y="72" width="195" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="169.5" y="93.5">«requirement»</tspan><tspan x="169.5" dy="15">Two AGCs Block II</tspan><tspan x="169.5" dy="15">Comanche 055 + LMY99/1</tspan><tspan x="169.5" dy="15">CMC ENTRY ≠ LGC LANDING</tspan></text>
<rect id="p27Requirement" x="75.5" y="264" width="188" height="82" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="169.5" y="290">«requirement»</tspan><tspan x="169.5" dy="15">P27 verbs V70–V73 only</tspan><tspan x="169.5" dy="15">Not the CCATS path</tspan></text>
<rect id="usbCsmRequirement" x="303" y="72" width="237" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="421.5" y="93.5">«requirement»</tspan><tspan x="421.5" dy="15">USB CSM</tspan><tspan x="421.5" dy="15">2106.40625 ↑ / 2287.5 PM ↓</tspan><tspan x="421.5" dy="15">2272.5 FM · PCM 51.2/1.6 kbps</tspan></text>
<rect id="usbLmRequirement" x="576" y="72" width="209" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="680.5" y="93.5">«requirement»</tspan><tspan x="680.5" dy="15">USB LM</tspan><tspan x="680.5" dy="15">2101.802 ↑ / 2282.5</tspan><tspan x="680.5" dy="15">20.5 dB · 20 W · no PM+FM</tspan></text>
<rect id="cmEcsRequirement" x="845.5" y="72" width="195" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="943" y="93.5">«requirement»</tspan><tspan x="943" dy="15">CM ECS 5.0 psia 100% O2</tspan><tspan x="943" dy="15">3 crew / 14 d spec</tspan><tspan x="943" dy="15">A11 196 h vs 336 h spec</tspan></text>
<rect id="a7lRequirement" x="1101" y="72" width="258" height="82" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1230" y="98">«requirement»</tspan><tspan x="1230" dy="15">A7L 3.75±0.25 psid</tspan><tspan x="1230" dy="15">EV 19.69 kg · PLSS 1.04 lb / 4 h</tspan></text>
<rect id="a11MassRequirement" x="1395" y="72" width="237" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1513.5" y="93.5">«requirement»</tspan><tspan x="1513.5" dy="15">PK p.109 S-IC 5,022,674</tspan><tspan x="1513.5" dy="15">S-II 1,059,171; S-IVB 260,523</tspan><tspan x="1513.5" dy="15">SPS load / CSM Δv UNKNOWN</tspan></text>
<rect id="rsoRequirement" x="1668" y="72" width="230" height="82" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1783" y="98">«requirement»</tspan><tspan x="1783" dy="15">RSO outside MCC</tspan><tspan x="1783" dy="15">UHF destruct; safed after EO</tspan></text>
<rect id="a11AtypicalRequirement" x="821" y="270" width="244" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="943" y="291.5">«requirement»</tspan><tspan x="943" dy="15">A11 atypical vs generic stack</tspan><tspan x="943" dy="15">1 EVA / 196 h; no LRV/SIM</tspan><tspan x="943" dy="15">P66 LGC landing; ropes sourced</tspan></text>
<rect id="scsRequirement" x="1934" y="72" width="209" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="2038.5" y="93.5">«requirement»</tspan><tspan x="2038.5" dy="15">CSM SCS analog backup</tspan><tspan x="2038.5" dy="15">AGC_CM vs SCS crew-select</tspan><tspan x="2038.5" dy="15">Full switch deck TBD</tspan></text>
<rect id="pngsRequirement" x="2179" y="72" width="181" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="2269.5" y="93.5">«requirement»</tspan><tspan x="2269.5" dy="15">PNGS ≠ AGS</tspan><tspan x="2269.5" dy="15">AGC_LM + IMU + radars</tspan><tspan x="2269.5" dy="15">R47 inits AGS</tspan></text>
<rect id="eclssLoopRequirement" x="2396" y="72" width="170" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="2481" y="93.5">«requirement»</tspan><tspan x="2481" dy="15">ECLSS O2/H2O/LiOH</tspan><tspan x="2481" dy="15">5.0 psia 100% O2</tspan><tspan x="2481" dy="15">CO2 ≤7.6 torr</tspan></text>
<rect id="epsRequirement" x="2602" y="72" width="216" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="2710" y="93.5">«requirement»</tspan><tspan x="2710" dy="15">EPS A11 Press Kit</tspan><tspan x="2710" dy="15">SM 3 FC; CM 3 AgZn+charger</tspan><tspan x="2710" dy="15">LM 6 AgZn + ECA; 28 V DC</tspan></text>
<rect id="agsRequirement" x="2854" y="72" width="216" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="2962" y="93.5">«requirement»</tspan><tspan x="2962" dy="15">AGS AEA+ASA+DEDA</tspan><tspan x="2962" dy="15">AEA 4096×18, 5 μs, 32.7 lb</tspan><tspan x="2962" dy="15">Not a landing computer</tspan></text>
<rect id="dockingRequirement" x="3106" y="72" width="188" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="3200" y="93.5">«requirement»</tspan><tspan x="3200" dy="15">CM probe / LM drogue</tspan><tspan x="3200" dy="15">12 ring latches</tspan><tspan x="3200" dy="15">soft then hard; hw off</tspan></text>
<rect id="rcsRequirement" x="3330" y="72" width="188" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="3424" y="93.5">«requirement»</tspan><tspan x="3424" dy="15">RCS: SM/LM 100 lbf</tspan><tspan x="3424" dy="15">CM 93 lbf; SM 4 quads</tspan><tspan x="3424" dy="15">Δv table still UNKNOWN</tspan></text>
<rect id="spsRequirement" x="3554" y="72" width="216" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="3662" y="93.5">«requirement»</tspan><tspan x="3662" dy="15">SPS conflict</tspan><tspan x="3662" dy="15">20,500 PK vs 21,500 D-7375</tspan><tspan x="3662" dy="15">loaded mass UNKNOWN</tspan></text>
<rect id="dpsRequirement" x="3806" y="72" width="188" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="3900" y="93.5">«requirement»</tspan><tspan x="3900" dy="15">DPS conflict</tspan><tspan x="3900" dy="15">9,870 / 1,050–6,300 PK</tspan><tspan x="3900" dy="15">vs 10,500 10:1 D-7143</tspan></text>
<rect id="pipaRequirement" x="4030" y="72" width="170" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="4115" y="93.5">«requirement»</tspan><tspan x="4115" dy="15">PIPA scale</tspan><tspan x="4115" dy="15">CM 5.85 cm/s/pulse</tspan><tspan x="4115" dy="15">LM 1.0 cm/s/pulse</tspan></text>
<path d="M 169.5,160 L 169.5,264" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 943,160 L 943,270" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text class="small" x="181.5" y="212">refine</text>
<text class="small" x="955" y="215">A11 instance</text>
</g>
