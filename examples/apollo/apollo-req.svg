<svg xmlns="http://www.w3.org/2000/svg" width="917" height="554" viewBox="0 0 917 554">
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.label{font-size:13px}.small{font-size:11px}.header{font-size:14px;font-weight:600}</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1D4ED8"/></marker>
<marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#334155"/></marker>
<marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="strokeWidth"><polygon points="0 6,6 0,12 6,6 12" fill="#111827" stroke="#111827"/></marker>
</defs>
<rect x="0" y="0" width="917" height="554" fill="#FFFFFF"/>
<rect x="2" y="38" width="913" height="512" fill="none" stroke="#333333" stroke-width="2"/>
<path d="M 2 1 H 424 L 440 38 H 2 Z" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
<text class="header" x="12" y="24">[req.mb] Apollo 11 Sourced Requirements [Apollo11]</text>
<rect x="2" y="38" width="913" height="514" fill="none" stroke="#333333" stroke-width="0"/>
<g transform="translate(2,40)">
<rect id="safety" x="72" y="72" width="216" height="168" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="180" y="96">«requirement»</tspan><tspan x="180" dy="15">Safety</tspan><tspan x="180" dy="15">The Range Safety Officer</tspan><tspan x="180" dy="15">shall command</tspan><tspan x="180" dy="15">ultra-high-frequency (UHF)</tspan><tspan x="180" dy="15">destruct from outside</tspan><tspan x="180" dy="15">Mission Control until that</tspan><tspan x="180" dy="15">command is safed after</tspan><tspan x="180" dy="15">Earth orbit.</tspan></text>
<rect id="land" x="324" y="72" width="223" height="156" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="435.5" y="120">«requirement»</tspan><tspan x="435.5" dy="15">Land</tspan><tspan x="435.5" dy="15">The Lunar Module shall land</tspan><tspan x="435.5" dy="15">two crew on the Moon under</tspan><tspan x="435.5" dy="15">rate of descent.</tspan></text>
<rect id="talk" x="583" y="72" width="223" height="156" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="694.5" y="120">«requirement»</tspan><tspan x="694.5" dy="15">Talk</tspan><tspan x="694.5" dy="15">The stack shall communicate</tspan><tspan x="694.5" dy="15">with Mission Control on</tspan><tspan x="694.5" dy="15">Unified S-Band.</tspan></text>
<rect id="abort" x="72" y="284" width="230" height="156" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="187" y="324.5">«requirement»</tspan><tspan x="187" dy="15">Abort</tspan><tspan x="187" dy="15">The Abort Guidance System</tspan><tspan x="187" dy="15">shall provide abort guidance</tspan><tspan x="187" dy="15">without landing the Lunar</tspan><tspan x="187" dy="15">Module.</tspan></text>
<rect id="air" x="338" y="284" width="237" height="156" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="456.5" y="332">«requirement»</tspan><tspan x="456.5" dy="15">Air</tspan><tspan x="456.5" dy="15">The Lunar Module shall supply</tspan><tspan x="456.5" dy="15">oxygen, water, and lithium</tspan><tspan x="456.5" dy="15">hydroxide for life support.</tspan></text>
<rect id="guide" x="611" y="284" width="230" height="156" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="726" y="317">«requirement»</tspan><tspan x="726" dy="15">Guide</tspan><tspan x="726" dy="15">The Lunar Module Primary</tspan><tspan x="726" dy="15">Guidance system shall use</tspan><tspan x="726" dy="15">landing radar during descent</tspan><tspan x="726" dy="15">and rendezvous radar during</tspan><tspan x="726" dy="15">ascent.</tspan></text>
</g>
</svg>
