<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1174" viewBox="0 0 1540 1174">
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.label{font-size:13px}.small{font-size:11px}.header{font-size:14px;font-weight:600}</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1D4ED8"/></marker>
<marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#334155"/></marker>
<marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="strokeWidth"><polygon points="0 6,6 0,12 6,6 12" fill="#111827" stroke="#111827"/></marker>
</defs>
<rect x="0" y="0" width="1540" height="1174" fill="#FFFFFF"/>
<rect x="2" y="38" width="1536" height="1132" fill="none" stroke="#333333" stroke-width="2"/>
<path d="M 2 1 H 424 L 440 38 H 2 Z" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
<text class="header" x="12" y="24">[req.mb] Apollo 11 Sourced Requirements [Apollo11]</text>
<rect x="2" y="38" width="1536" height="1134" fill="none" stroke="#333333" stroke-width="0"/>
<g transform="translate(2,40)">
<rect id="agcRequirement" x="72" y="72" width="258" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="201" y="93.5">«requirement»</tspan><tspan x="201" dy="15">Two Block II guidance computers.</tspan><tspan x="201" dy="15">Command Module entry programs</tspan><tspan x="201" dy="15">are not Lunar Module landing</tspan><tspan x="201" dy="15">programs.</tspan></text>
<rect id="cmEcsRequirement" x="366" y="72" width="237" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="484.5" y="93.5">«requirement»</tspan><tspan x="484.5" dy="15">Command Module cabin is five</tspan><tspan x="484.5" dy="15">pounds per square inch of</tspan><tspan x="484.5" dy="15">oxygen. The specification is</tspan><tspan x="484.5" dy="15">three crew for fourteen days.</tspan></text>
<rect id="usbCsmRequirement" x="639" y="72" width="244" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="761" y="93.5">«requirement»</tspan><tspan x="761" dy="15">Command/Service Module Unified</tspan><tspan x="761" dy="15">S-Band uses the sourced uplink</tspan><tspan x="761" dy="15">and the two sourced downlinks.</tspan><tspan x="761" dy="15">Rates stay in the Press Kit.</tspan></text>
<rect id="usbLmRequirement" x="919" y="72" width="251" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1044.5" y="93.5">«requirement»</tspan><tspan x="1044.5" dy="15">Lunar Module Unified S-Band</tspan><tspan x="1044.5" dy="15">uses a different frequency</tspan><tspan x="1044.5" dy="15">pair. Phase and frequency</tspan><tspan x="1044.5" dy="15">modulation do not run together.</tspan></text>
<rect id="rsoRequirement" x="1206" y="72" width="258" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1335" y="93.5">«requirement»</tspan><tspan x="1335" dy="15">The Range Safety Officer sits</tspan><tspan x="1335" dy="15">outside Mission Control Center.</tspan><tspan x="1335" dy="15">Destruct is ultra-high frequency</tspan><tspan x="1335" dy="15">and is safed after Earth orbit.</tspan></text>
<rect id="p27Requirement" x="82.5" y="216" width="237" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="201" y="237.5">«requirement»</tspan><tspan x="201" dy="15">P27 accepts verbs V70 through</tspan><tspan x="201" dy="15">V73 only. That path is not</tspan><tspan x="201" dy="15">the ground CCATS uplink.</tspan></text>
<rect id="a11AtypicalRequirement" x="373" y="231" width="223" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="484.5" y="252.5">«requirement»</tspan><tspan x="484.5" dy="15">This instance is atypical:</tspan><tspan x="484.5" dy="15">control room two, cryogenic</tspan><tspan x="484.5" dy="15">tankage two plus two, P66</tspan><tspan x="484.5" dy="15">landing, sourced ropes.</tspan></text>
<rect id="a7lRequirement" x="72" y="390" width="244" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="194" y="411.5">«requirement»</tspan><tspan x="194" dy="15">The A7L pressure garment holds</tspan><tspan x="194" dy="15">a sourced suit differential.</tspan><tspan x="194" dy="15">Portable life-support oxygen</tspan><tspan x="194" dy="15">and heat loads stay cited.</tspan></text>
<rect id="a11MassRequirement" x="352" y="390" width="258" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="481" y="411.5">«requirement»</tspan><tspan x="481" dy="15">Serials and Press Kit tank loads</tspan><tspan x="481" dy="15">are documentation, not a</tspan><tspan x="481" dy="15">required-mass shall. Propellant</tspan><tspan x="481" dy="15">load and lunar Δv stay unmarked.</tspan></text>
<rect id="scsRequirement" x="646" y="390" width="244" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="768" y="411.5">«requirement»</tspan><tspan x="768" dy="15">Stabilization and Control is</tspan><tspan x="768" dy="15">the analog backup. The crew</tspan><tspan x="768" dy="15">selects between the guidance</tspan><tspan x="768" dy="15">computer and that analog path.</tspan></text>
<rect id="pngsRequirement" x="926" y="390" width="258" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1055" y="411.5">«requirement»</tspan><tspan x="1055" dy="15">Primary Guidance, Navigation,</tspan><tspan x="1055" dy="15">and Control is not Abort</tspan><tspan x="1055" dy="15">Guidance. The computer, inertial</tspan><tspan x="1055" dy="15">unit, and radars belong to it.</tspan></text>
<rect id="eclssLoopRequirement" x="1220" y="390" width="237" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1338.5" y="411.5">«requirement»</tspan><tspan x="1338.5" dy="15">Life support supplies oxygen,</tspan><tspan x="1338.5" dy="15">water, and lithium hydroxide.</tspan><tspan x="1338.5" dy="15">Cabin carbon dioxide stays at</tspan><tspan x="1338.5" dy="15">or below the sourced limit.</tspan></text>
<rect id="epsRequirement" x="72" y="549" width="251" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="197.5" y="570.5">«requirement»</tspan><tspan x="197.5" dy="15">Electrical power is three</tspan><tspan x="197.5" dy="15">Service Module fuel cells plus</tspan><tspan x="197.5" dy="15">silver-zinc batteries. There is</tspan><tspan x="197.5" dy="15">no stage-to-stage power.</tspan></text>
<rect id="agsRequirement" x="359" y="549" width="265" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="491.5" y="570.5">«requirement»</tspan><tspan x="491.5" dy="15">Abort Guidance is the electronics</tspan><tspan x="491.5" dy="15">assembly, sensor assembly, and</tspan><tspan x="491.5" dy="15">data-entry display. It is not</tspan><tspan x="491.5" dy="15">a landing computer.</tspan></text>
<rect id="dockingRequirement" x="660" y="549" width="251" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="785.5" y="570.5">«requirement»</tspan><tspan x="785.5" dy="15">Docking is Command Module probe</tspan><tspan x="785.5" dy="15">to Lunar Module drogue, then</tspan><tspan x="785.5" dy="15">twelve ring latches. Soft dock</tspan><tspan x="785.5" dy="15">precedes hard dock.</tspan></text>
<rect id="rcsRequirement" x="947" y="549" width="251" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1072.5" y="570.5">«requirement»</tspan><tspan x="1072.5" dy="15">Service Module and Lunar Module</tspan><tspan x="1072.5" dy="15">reaction-control engines share</tspan><tspan x="1072.5" dy="15">one sourced thrust. Command</tspan><tspan x="1072.5" dy="15">Module engines use another.</tspan></text>
<rect id="spsRequirement" x="1234" y="594" width="230" height="118" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1349" y="615.5">«requirement»</tspan><tspan x="1349" dy="15">Service Propulsion System</tspan><tspan x="1349" dy="15">sources disagree on vacuum</tspan><tspan x="1349" dy="15">thrust. There is no required</tspan><tspan x="1349" dy="15">thrust and no loaded-mass</tspan><tspan x="1349" dy="15">requirement.</tspan></text>
<rect id="dpsRequirement" x="72" y="708" width="216" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="180" y="729.5">«requirement»</tspan><tspan x="180" dy="15">Descent Propulsion System</tspan><tspan x="180" dy="15">sources disagree on thrust</tspan><tspan x="180" dy="15">and throttle. There is no</tspan><tspan x="180" dy="15">required thrust.</tspan></text>
<rect id="pipaRequirement" x="324" y="708" width="223" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="435.5" y="729.5">«requirement»</tspan><tspan x="435.5" dy="15">Pulse Integrating Pendulous</tspan><tspan x="435.5" dy="15">Accelerometer scale differs</tspan><tspan x="435.5" dy="15">between Command Module and</tspan><tspan x="435.5" dy="15">Lunar Module.</tspan></text>
<rect id="vhfRequirement" x="583" y="708" width="244" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="705" y="729.5">«requirement»</tspan><tspan x="705" dy="15">Very High Frequency voice uses</tspan><tspan x="705" dy="15">two sourced channels. Recovery</tspan><tspan x="705" dy="15">uses the sourced guard</tspan><tspan x="705" dy="15">frequency.</tspan></text>
<rect id="isolationRequirement" x="863" y="708" width="251" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="988.5" y="729.5">«requirement»</tspan><tspan x="988.5" dy="15">There is no stage-to-stage</tspan><tspan x="988.5" dy="15">electrical power. There is no</tspan><tspan x="988.5" dy="15">Command/Service Module to Lunar</tspan><tspan x="988.5" dy="15">Module propellant crossfeed.</tspan></text>
<rect id="recoveryRequirement" x="1150" y="708" width="244" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1272" y="729.5">«requirement»</tspan><tspan x="1272" dy="15">Splash is the flown Ground</tspan><tspan x="1272" dy="15">Elapsed Time from the Mission</tspan><tspan x="1272" dy="15">Report. Distance is from the</tspan><tspan x="1272" dy="15">recovery ship, not the target.</tspan></text>
<rect id="kscRequirement" x="72" y="867" width="251" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="197.5" y="888.5">«requirement»</tspan><tspan x="197.5" dy="15">Kennedy Space Center Launch</tspan><tspan x="197.5" dy="15">Control owns commit from Firing</tspan><tspan x="197.5" dy="15">Room 1. Voice hands to Mission</tspan><tspan x="197.5" dy="15">Control at tower clear.</tspan></text>
<rect id="lm5ConsumableRequirement" x="359" y="942" width="265" height="118" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="491.5" y="963.5">«requirement»</tspan><tspan x="491.5" dy="15">Lunar Module descent oxygen is</tspan><tspan x="491.5" dy="15">a teaching figure. Another</tspan><tspan x="491.5" dy="15">technical note prints a different</tspan><tspan x="491.5" dy="15">tank pressure. There is no</tspan><tspan x="491.5" dy="15">required pressure.</tspan></text>
<rect id="apsRequirement" x="660" y="867" width="258" height="103" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="789" y="888.5">«requirement»</tspan><tspan x="789" dy="15">Ascent Propulsion System thrust,</tspan><tspan x="789" dy="15">rise time, and cant stay as the</tspan><tspan x="789" dy="15">cited experience report states</tspan><tspan x="789" dy="15">them.</tspan></text>
<path d="M 201,175 L 201,216" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 484.5,175 L 484.5,231" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text class="small" x="213" y="195.5">refine</text>
<text class="small" x="496.5" y="203">A11 instance</text>
</g>
</svg>
