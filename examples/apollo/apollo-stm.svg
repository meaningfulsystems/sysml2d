</defs>
<rect x="0" y="0" width="1022" height="791" fill="#FFFFFF"/>
<rect x="2" y="38" width="1018" height="749" fill="none" stroke="#333333" stroke-width="2"/>
<path d="M 2 1 H 472 L 488 38 H 2 Z" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
<text class="header" x="12" y="24">[stv.mb] Apollo 11 Earth Coast [earthCoast : earthCoast]</text>
<rect x="2" y="38" width="1018" height="751" fill="none" stroke="#333333" stroke-width="0"/>
<g transform="translate(2,40)">
