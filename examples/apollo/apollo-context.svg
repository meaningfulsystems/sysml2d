<rect id="MSFN" x="422" y="72" width="170" height="80" rx="4" fill="#F7F9FC" stroke="#334155" stroke-width="2"/>
<text class="label" text-anchor="middle" x="507" y="112">tracking net</text>
<rect id="earth" x="752" y="77" width="150" height="70" rx="4" fill="#F7F9FC" stroke="#334155" stroke-width="2"/>
