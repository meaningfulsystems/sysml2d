<text class="small" text-anchor="end" x="308.667" y="179">path A / voice</text>
<text class="small" x="375.333" y="270">destruct UHF (not Mission Control)</text>
<text class="small" text-anchor="middle" x="672" y="100">USB / 210-ft / Parkes</text>
<text class="small" x="640" y="187">~1.3 s</text>
