<svg xmlns="http://www.w3.org/2000/svg" width="1923" height="868" viewBox="0 0 1923 868">
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.label{font-size:13px}.small{font-size:11px}.header{font-size:14px;font-weight:600}</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1D4ED8"/></marker>
<marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#334155"/></marker>
<marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="strokeWidth"><polygon points="0 6,6 0,12 6,6 12" fill="#111827" stroke="#111827"/></marker>
</defs>
<rect x="0" y="0" width="1923" height="868" fill="#FFFFFF"/>
<rect x="2" y="38" width="1919" height="826" fill="none" stroke="#333333" stroke-width="2"/>
<path d="M 2 1 H 336 L 352 38 H 2 Z" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
<text class="header" x="12" y="24">[req.mb] Toaster Requirements [Toaster]</text>
<rect x="2" y="38" width="1919" height="828" fill="none" stroke="#333333" stroke-width="0"/>
<g transform="translate(2,40)">
<rect id="toastSafetyRequirement" x="855" y="72" width="209" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="959.5" y="93.5">«requirement»</tspan><tspan x="959.5" dy="15">REQ-T-001 Toast Safety</tspan><tspan x="959.5" dy="15">Prevent exposed energized</tspan><tspan x="959.5" dy="15">or overheating hazards.</tspan></text>
<rect id="electricalSafetyRequirement" x="395" y="270" width="258" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="524" y="291.5">«requirement»</tspan><tspan x="524" dy="15">REQ-T-002 Electrical Safety</tspan><tspan x="524" dy="15">Comply with applicable household</tspan><tspan x="524" dy="15">appliance electrical standards.</tspan></text>
<rect id="browningRequirement" x="1048" y="270" width="223" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1159.5" y="291.5">«requirement»</tspan><tspan x="1159.5" dy="15">REQ-T-003 Browning Quality</tspan><tspan x="1159.5" dy="15">Deliver selectable browning</tspan><tspan x="1159.5" dy="15">without burning bread.</tspan></text>
<rect id="timingRequirement" x="1483.5" y="270" width="223" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1595" y="291.5">«requirement»</tspan><tspan x="1595" dy="15">REQ-T-004 Toast Timing</tspan><tspan x="1595" dy="15">Heating duration within ±5%</tspan><tspan x="1595" dy="15">of the selected setting.</tspan></text>
<rect id="powerRatingRequirement" x="72" y="468" width="216" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="180" y="489.5">«requirement»</tspan><tspan x="180" dy="15">REQ-T-010 Power Rating</tspan><tspan x="180" dy="15">Operate within rated power</tspan><tspan x="180" dy="15">under normal use.</tspan></text>
<rect id="surfaceTemperatureRequirement" x="360" y="468" width="251" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="485.5" y="489.5">«requirement»</tspan><tspan x="485.5" dy="15">REQ-T-011 Surface Temp</tspan><tspan x="485.5" dy="15">Accessible exteriors shall stay</tspan><tspan x="485.5" dy="15">within safe touch limits.</tspan></text>
<rect id="thermalCutoffRequirement" x="683" y="468" width="293" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="829.5" y="489.5">«requirement»</tspan><tspan x="829.5" dy="15">REQ-T-012 Thermal Cutoff</tspan><tspan x="829.5" dy="15">Disable heating if internal</tspan><tspan x="829.5" dy="15">temperature exceeds a safe threshold.</tspan></text>
<rect id="browningLevelsRequirement" x="1048" y="468" width="223" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1159.5" y="489.5">«requirement»</tspan><tspan x="1159.5" dy="15">REQ-T-020 Browning Levels</tspan><tspan x="1159.5" dy="15">At least three distinct and</tspan><tspan x="1159.5" dy="15">repeatable browning levels.</tspan></text>
<rect id="carriageReleaseRequirement" x="1343" y="468" width="216" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1451" y="489.5">«requirement»</tspan><tspan x="1451" dy="15">REQ-T-021 Carriage Release</tspan><tspan x="1451" dy="15">Release on timer expiry</tspan><tspan x="1451" dy="15">or user cancel.</tspan></text>
<rect id="crumbTrayForceRequirement" x="1343" y="666" width="216" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1451" y="687.5">«requirement»</tspan><tspan x="1451" dy="15">REQ-T-030 Crumb Tray Force</tspan><tspan x="1451" dy="15">Removal force no more</tspan><tspan x="1451" dy="15">than 10 N.</tspan></text>
<rect id="cycleLifeRequirement" x="1631" y="468" width="216" height="88" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
<text class="label" text-anchor="middle"><tspan x="1739" y="489.5">«requirement»</tspan><tspan x="1739" dy="15">REQ-T-040 Cycle Life</tspan><tspan x="1739" dy="15">Lever, latch, and carriage</tspan><tspan x="1739" dy="15">survive &gt;= 10,000 cycles.</tspan></text>
